name: word_tiles_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Version dành cho iOS (chỉnh ở đây khi build iOS bằng Xcode / Archive)
version: 1.0.0+13

environment:
  sdk: ^3.13.0

dependencies:
  funtap_global_sdk:
    path: ./funtap_global_sdk
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_soloud: ^4.1.7
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  config:
    disable-swift-package-manager: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/chapter/
    - assets/font/
    - assets/levels/english/
    - assets/levels/portuguese/
    - assets/levels/russian/
    - assets/levels/spanish/
    - assets/levels/turkish/
    - assets/levels/german/
    - assets/levels/french/
    - assets/levels/italian/

  fonts:
    - family: MikadoBold
      fonts:
        - asset: assets/font/mikadobold.otf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_logo.jpg"
  windows:
    generate: true
    image_path: "assets/images/app_logo.jpg"
  macos:
    generate: true
    image_path: "assets/images/app_logo.jpg"
